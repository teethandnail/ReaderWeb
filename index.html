<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件查看器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>文件查看器</h1>
        <div class="upload-section">
            <input type="file" id="fileInput" accept=".txt,.pdf">
            <label for="fileInput" class="upload-button">选择文件 (.txt, .pdf)</label>
        </div>
        <div class="text-input-section">
            <h2>手动输入文字</h2>
            <textarea id="textInput" placeholder="在此输入文字内容..."></textarea>
            <button id="showTextBtn" class="show-button">展示</button>
        </div>
        <div id="fileContent" class="content-display">
            <p class="placeholder">请选择一个文件来查看内容</p>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
