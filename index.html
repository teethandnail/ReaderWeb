<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阅读器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1a1714;
            --paper: #f4f0e8;
            --muted: #9e9589;
            --accent: #c8a96e;
            --border: #d8d0c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: 'Noto Serif SC', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* 背景纹理 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(200, 169, 110, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(26, 23, 20, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        .page {
            width: 100%;
            max-width: 640px;
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 标题区域 */
        .header {
            margin-bottom: 3rem;
            text-align: left;
        }

        .header-eyebrow {
            font-family: 'Noto Serif SC', serif;
            font-weight: 300;
            font-size: 0.72rem;
            letter-spacing: 0.25em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 0.8rem;
        }

        .header-title {
            font-family: 'DM Serif Display', serif;
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 400;
            line-height: 1.1;
            color: var(--ink);
            letter-spacing: -0.02em;
        }

        .header-title em {
            font-style: italic;
            color: var(--accent);
        }

        .header-rule {
            margin-top: 1.4rem;
            height: 1px;
            background: linear-gradient(to right, var(--border), transparent);
        }

        /* 输入区域 */
        .input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-label {
            display: block;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 1.4rem 1.5rem;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid var(--border);
            border-radius: 2px;
            font-family: 'Noto Serif SC', serif;
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.85;
            color: var(--ink);
            resize: vertical;
            outline: none;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
            caret-color: var(--accent);
        }

        textarea::placeholder {
            color: var(--muted);
            font-style: italic;
        }

        textarea:focus {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(200, 169, 110, 0.12);
        }

        /* 字数统计 */
        .char-count {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            pointer-events: none;
            transition: color 0.2s;
        }

        /* 底部操作行 */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hint {
            font-size: 0.78rem;
            color: var(--muted);
            font-style: italic;
        }

        .btn-read {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 2rem;
            background: var(--ink);
            color: var(--paper);
            border: none;
            border-radius: 2px;
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: background 0.22s, transform 0.18s, box-shadow 0.22s;
            position: relative;
            overflow: hidden;
        }

        .btn-read::after {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 0;
        }

        .btn-read:hover::after {
            transform: translateX(0);
        }

        .btn-read:hover {
            box-shadow: 0 4px 20px rgba(26, 23, 20, 0.2);
            transform: translateY(-1px);
        }

        .btn-read span,
        .btn-read svg {
            position: relative;
            z-index: 1;
        }

        .btn-read:active {
            transform: translateY(0);
        }

        .btn-read svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s;
        }

        .btn-read:hover svg {
            transform: translateX(3px);
        }

        /* 空内容提示动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        textarea.shake {
            animation: shake 0.4s ease;
            border-color: #c0705a !important;
        }

        /* 装饰性页码 */
        .deco-num {
            position: fixed;
            bottom: 2rem;
            right: 2.5rem;
            font-family: 'DM Serif Display', serif;
            font-size: 5rem;
            color: rgba(26, 23, 20, 0.04);
            line-height: 1;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <p class="header-eyebrow">文字阅读器</p>
            <h1 class="header-title">粘贴文字，<em>专注阅读</em></h1>
            <div class="header-rule"></div>
        </header>

        <div class="input-wrapper">
            <label class="input-label" for="textInput">输入内容</label>
            <textarea
                id="textInput"
                placeholder="将文字粘贴至此，或直接开始输入……"
                spellcheck="false"
            ></textarea>
            <span class="char-count" id="charCount">0 字</span>
        </div>

        <div class="actions">
            <span class="hint">⌘ + Enter 快速展示</span>
            <button class="btn-read" id="showTextBtn">
                <span>开始阅读</span>
                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>
    </div>

    <div class="deco-num">01</div>

    <script>
        const textarea = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const btn = document.getElementById('showTextBtn');

        textarea.addEventListener('input', () => {
            const len = textarea.value.length;
            charCount.textContent = len > 0 ? `${len} 字` : '0 字';
        });

        function openReader() {
            const text = textarea.value;
            if (!text.trim()) {
                textarea.classList.remove('shake');
                void textarea.offsetWidth;
                textarea.classList.add('shake');
                textarea.addEventListener('animationend', () => textarea.classList.remove('shake'), { once: true });
                return;
            }
            localStorage.setItem('readerText', text);
            window.open('reader.html', '_blank');
        }

        btn.addEventListener('click', openReader);

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                openReader();
            }
        });
    </script>
</body>
</html>
